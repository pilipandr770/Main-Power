# Lokaler Komplettstart:  docker compose up --build   ->  http://localhost:8000
# Demo-Konten:            SEED=1 SEED_DEMO=1 docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mainpower
      POSTGRES_PASSWORD: mainpower
      POSTGRES_DB: mainpower
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mainpower"]
      interval: 5s
      retries: 10
  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://mainpower:mainpower@db:5432/mainpower
      BASE_URL: http://localhost:8000
      COOKIE_SECURE: "0"
      SECRET_KEY: ${SECRET_KEY:-lokal-nur-zum-testen-bitte-nicht-in-produktion}
      SEED: ${SEED:-1}
      SEED_DEMO: ${SEED_DEMO:-1}
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
