# Produktion (Hostinger-VPS o. Ä.):
#   cp .env.example .env   # ausfüllen (SECRET_KEY, POSTGRES_PASSWORD, DOMAIN, ANTHROPIC_API_KEY ...)
#   docker compose -f docker-compose.prod.yml up -d --build
# Variante Cloudflare Tunnel (keine offenen Ports):  ... --profile tunnel up -d   (CLOUDFLARE_TUNNEL_TOKEN in .env)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mainpower
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
      POSTGRES_DB: mainpower
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mainpower"]
      interval: 10s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mainpower:${POSTGRES_PASSWORD}@db:5432/mainpower
      BASE_URL: https://${DOMAIN:?DOMAIN in .env setzen}
      COOKIE_SECURE: "1"
      FLASK_ENV: production
    volumes: ["uploads:/app/instance"]
    depends_on:
      db: {condition: service_healthy}
  sync:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mainpower:${POSTGRES_PASSWORD}@db:5432/mainpower
    entrypoint: ["sh", "-c", "while true; do flask sync-events; sleep 3600; done"]
    depends_on:
      app: {condition: service_healthy}
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
volumes:
  pgdata:
  uploads:
  caddy_data:
