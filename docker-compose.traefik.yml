# Variante für Server mit bereits laufendem Traefik (Hostinger-VPS, host-network):
# Die App lauscht nur lokal auf 127.0.0.1:${APP_PORT:-8010}; Traefik routet per Datei (deploy/traefik-mainpower.yml) dorthin.
#   docker compose -f docker-compose.traefik.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mainpower
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
      POSTGRES_DB: mainpower
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mainpower"]
      interval: 10s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mainpower:${POSTGRES_PASSWORD}@db:5432/mainpower
      BASE_URL: https://${DOMAIN:?DOMAIN in .env setzen}
      COOKIE_SECURE: "1"
      FLASK_ENV: production
      # Rate-Limits gemeinsam für alle Gunicorn-Worker zählen (memory:// zählt je Worker getrennt)
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
    ports: ["127.0.0.1:${APP_PORT:-8010}:8000"]
    volumes: ["uploads:/app/instance"]
    networks: [default, laws_net]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "32mb", "--maxmemory-policy", "allkeys-lru"]
  sync:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mainpower:${POSTGRES_PASSWORD}@db:5432/mainpower
    entrypoint: ["sh", "-c", "while true; do flask sync-events; sleep 3600; done"]
    depends_on:
      app: {condition: service_healthy}
volumes:
  pgdata:
  uploads:
networks:
  default: {}
  laws_net:
    external: true  # vom separaten laws_pipeline-Projekt angelegt (Gesetzes-Suche, nur intern erreichbar)
